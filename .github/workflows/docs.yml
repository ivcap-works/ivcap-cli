# .github/workflows/docs.yml
#
# Builds the MkDocs Material site via the squidfunk/mkdocs-material Docker
# image (same image used by `make docs-serve` / `make docs-build` locally)
# and deploys the result to the gh-pages branch.
#
# Triggered by:
#   - Push to main that touches docs/, cmd/, mkdocs.yml, ivcap.go, or this file
#   - Manual workflow_dispatch
#
# Enable GitHub Pages in repo Settings → Pages → Source: gh-pages branch / root.

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "cmd/**"
      - "ivcap.go"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Cancel in-progress deploys on the same branch.
concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to push the gh-pages branch

jobs:
  deploy:
    name: Build & deploy MkDocs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Go: regenerate cobra command reference ───────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true

      - name: Regenerate command reference (cobra → docs/ + man/)
        run: make build-docs

      # ── Docker: build MkDocs site (squidfunk/mkdocs-material) ───────────────
      - name: Build MkDocs site via Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/docs \
            squidfunk/mkdocs-material build --clean

      # ── Deploy built site/ to gh-pages branch ───────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          commit_message: "docs: deploy ${{ github.sha }} [skip ci]"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
